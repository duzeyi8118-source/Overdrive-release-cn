name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.19 -PoverdriveVersionCode=49919 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.19-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.19-cn-sec
          name: OverDrive v49.9.19 - 驻车碰撞感应唤醒、防冲锁存SafeKeep、媒体闪避压音与毛玻璃桌面微件
          body: |
            ## OverDrive v49.9.19 定制版 (第一、二梯队全量特性合入)

            ### 💥 1. 驻车碰撞感应唤醒与 SafeKeep 视频防冲锁存 (Parked Impact & SafeKeep)
            - **驻车碰撞 IMU 加速度感应**：基于系统内置三轴加速度传感器实时采集向量模差，搭配重力基准滑动低通滤波与连续双脉冲防抖算法，支持高中低三挡灵敏度调节；
            - **智能哨兵联动控制器**：在驻车、熄火且哨兵处于设防状态下自动拉起前台传感器守护服务，检测到异常震动或刮擦撞击时秒级响应并向守护进程上报事件；
            - **SafeKeep 视频防冲锁存机制**：受保护视频自动登记至 `.safekeep/locks.json`，在磁盘空间不足执行自动循环覆写清理时，绝对跳过受保护视频，保障关键碰撞录像与取证数据永不被冲掉；
            - **全功能防冲锁存 Web 控制台**：支持视频加锁/解锁状态管理、待同步队列监控及多网盘/私有存储归档联动。

            ### 🎵 2. 语音播报原车音乐平滑闪避 (Media Ducking Control)
            - **系统级媒体平滑压低音量**：通过反射注入底层 `IAudioService.setTrackVolumeDuck` 并借力原厂语音助手通道，在 OverDrive 进行语音播报或告警提示时，原生级平滑压低当前播放的音乐/多媒体音量；
            - **租约自动释放与断电自愈**：播报完毕后音量自动丝滑恢复原值，内置 15 秒强制安全租约超时，彻底杜绝意外卡在低音量状态。

            ### 🪟 3. 桌面半透明毛玻璃快捷小组件 (Glass Widgets)
            - **精致半透明毛玻璃悬浮微件**：支持电池续航电芯、动态充电流光、实时行程统计、RoadSense 路况感知、输出功率与实时胎压、快捷车控等 10+ 种车规级微件；
            - **智能前台桌面感应**：仅在车机原生桌面显示，打开第三方 App 或挂倒挡时自动避让隐藏；
            - **屏幕自由拖拽排布**：支持直观的长按拖拽屏幕自由排布模式与全局快捷悬浮球。

            ### 🎨 4. 氛围灯随动调色盘 (AmbientPalette & LightConstants)
            - **31 色标准原厂色阶映射**：完整内置原厂 31 色标准色标表；
            - **CIE-Lab 色彩空间智能换算**：支持直接输入十六进制颜色 Hex 值，自动在感知均匀的 CIE-Lab 色彩空间中寻找最接近的原车档位，并集成开/关语音提示资源。

            ### 🇨🇳 5. 全量高标准简中本地化
            - **精细化地道中文审校**：全量补齐 `widgets` 80 项配置描述与 `safekeep` 核心词条，针对车机使用习惯逐一精校，彻底杜绝生硬机翻。
          files: release-assets/Overdrive-v49.9.19-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
