name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*[?]: ([0-9]+).*/\1/')
          echo "Building OverDrive version: $VERSION (versionCode: $VERSION_CODE)"
          ./gradlew assembleDebug -PoverdriveVersionName="$VERSION" -PoverdriveVersionCode="$VERSION_CODE" -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Found built APK ($VERSION): $APK_FILE"
          cp "$APK_FILE" "release-assets/Overdrive-v${VERSION}-cn-sec.apk"
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v${{ env.APP_VERSION }}-cn-sec"
          name: "OverDrive v${{ env.APP_VERSION }} - 哨兵通知门窗电量快照与目标行为态势升级"
          body: |
            ## OverDrive v${{ env.APP_VERSION }} 定制版

            ### 🚗 1. 车辆安防门窗与电量状态快照 (纯文本直出)
            - **车门车窗闭锁全面监控**：读取四门、车窗及后备箱/前盖闭锁状态，正常显示“车门已关 | 车窗全闭”，异常时直接标红预警（如“⚠️ 主驾门未关 / 右后窗未关”）；
            - **12V 小电瓶与动力电池 SOC 实显**：每次哨兵预警附带“小电瓶 12.8V | 动力电池 72%”，让车主随时掌握小电瓶健康度，消除趴窝焦虑；
            - **纯文本排版**：完全剔除 Markdown 语法，纯原生文本结构，手机锁屏预览与通知栏显示极佳。

            ### 🎯 2. 目标行为态势与驻车统计
            - **目标行为直观判定**：基于 AI 跟踪器精确判断目标是“逗留（时间/距离/持续靠近）”还是“快速路过/离开”；
            - **驻车时长与频次统计**：自动计算“驻车 3小时20分，第 3 次”，一眼识别高频误报或连续骚扰；
            - **触发摄像头方位精显**：延续 v49.9.28 触发源象限锁存与全方位中文映射。

            ### 🛡️ 2. 全库弹窗与交互文案 100% 汉化
            - **AI 事故取证包 (`events.js`)**：创建取证包提示、脱敏免责声明与操作按钮全量接入车规双语字典；
            - **座椅通风悬浮提示 (`vehicle-control.js`)**：支持/不支持通风车型的悬浮气泡提示全面汉化；
            - **语音助手与卡片 (`genai.js`)**：搜索结果卡片“查看详情”与结果截断说明汉化；
            - **摄像头控制 (`utils.js`)**：停止/查看/录制动态按钮与占位提示汉化；
            - **备份与恢复 (`backup-flow.js`)**：消除动态 DOM 插入时的全英文残留。

            ### ⚡ 3. 首屏直出零闪烁 (Zero-FOUC) 与无障碍体验
            - 彻底消除了 ABRP（“从未”、“共 0 条，失败 0 条”）、充电记录（“开始 → 结束”）、行程分析（“多开一段距离以计算”、“已存储 0 个行程”）、性能监控（“应用/系统/核”）等首屏未渲染前的英文字符串；
            - 规范了仪表盘、摄像头选择器、密码/令牌显隐等各处 `aria-label` 与 `title` 属性。

            ### 🔒 4. 门禁验证与安全发布
            - 严格通过 `scripts/i18n_check.py` 门禁（5190 个词条完全对称，0 errors，variant clean）；
            - APK 采用独立车机永久密钥签名，安全防冲。
          files: release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
