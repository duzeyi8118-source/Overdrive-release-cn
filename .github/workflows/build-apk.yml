name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.21 -PoverdriveVersionCode=49921 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.21-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.21-cn-sec
          name: OverDrive v49.9.21 - 全量模块车规级深度汉化与灾难级机翻地毯式清零
          body: |
            ## OverDrive v49.9.21 定制版 (全量深度汉化与机翻全面清零)

            ### 🇨🇳 1. 彻底清除全库灾难级机翻 (160+ 词条地毯式精校)
            - **车规级术语纠偏**：修正“阳光屋顶”为“天窗”、“阳光遮阳”为“遮阳帘”、“闪电失败”为“闪灯失败”、“锁已故障”为“闭锁失败”、“仅粉丝模式”为“纯通风模式”、“弹出感受器”为“制动踏板脚感”、“通道帮助”为“车道辅助”、“离境预防”为“车道偏离抑制”、“集群亮度”为“仪表盘亮度”、“重新计算”为“内循环”、“流量标志识别”为“交通标志识别”、“高1.5米”为“高 (1.5M)”、“双人”为“设备配对”；
            - **SOH 动力电池健康度**：修正“产能”为“标称容量”、“模型”为“适配车型”、“电池包容量与帧数据不匹配”优化为“电池包容量与实测帧不一致”、“采用实测值”校准流程全贯通；
            - **哨兵与录像系统**：彻底清除原 DOM 中预录被直出为“经济发展”、延录被直出为“邮件”的离谱历史机翻，修正“虚拟机”为“原厂记录仪”。

            ### 🚗 2. 整车控制与页面零延迟中文首屏 (Zero-FOUC & Full Coverage)
            - **车控系统 Tab 与 26 项悬浮控件**：修正缺失 `data-i18n` 的系统设置 Tab（原硬编码 `<span>System</span>`），汉化 26 处悬浮按钮 title，规范统一原厂“氛围灯”；
            - **开发者视图与隧道网络**：`remote-dev-view.html` 与 `wireguard.html` 实现 100% 页面中文直出，汉化启动会话、全屏、截图、键盘、返回等全部操作；
            - **充电中心与通知中心**：汉化充电曲线图表、日历弹窗、起止时间指示及前后轴状态。

            ### 🛡️ 3. 门禁与兼容性 100% 达标 (Strict Verification)
            - 严格通过 `scripts/i18n_check.py` 校验，无漏项 (missing=0, stale=0)，彻底杜绝港台/繁体用词报警；
            - 保留所有底层定制逻辑（蓝牙钥匙靠近感应解闭锁、本地脱离云端车控、电池 SOH 贯通、媒体平滑闪避压音）。
          files: release-assets/Overdrive-v49.9.21-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
