name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.20 -PoverdriveVersionCode=49920 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.20-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.20-cn-sec
          name: OverDrive v49.9.20 - 新增功能模块全量车规级简中精校与原生零延迟首屏
          body: |
            ## OverDrive v49.9.20 定制版 (新增模块全量汉化精校)

            ### 🇨🇳 1. 靠近感知页面全量汉化与架构改造 (Proximity Remote-Access)
            - **原生中文零延迟首屏**：页面属性升级为 `lang="zh-CN"`，所有 DOM 节点默认文本彻底告别硬编码英文，全部改为地道简体中文直出，杜绝弱网及首次加载时的闪烁 (FOUC-free)；
            - **全量 `data-i18n` 属性绑定**：补齐雷达卡片、信号时序图、标定采集、信号门限区间、车控联动规则、活动动态等 80+ 个关键节点的国际化 key 绑定与 `remote-access.js` 中文 fallback。

            ### 🛡️ 2. 防冲锁存 SafeKeep 330+ 词条全量精校 (SafeKeep Localization)
            - **云存储与备份规则深度汉化**：全量精校 Google Drive、OneDrive、Nextcloud、WebDAV / NAS、SFTP、S3 对象存储说明，对 5 大主标签页 (总览/存储目标/备份规则/配额与限制/同步动态) 实现原生中文直出；
            - **车规级语料规范**：严格遵循大陆用语规范，彻底清除港台用词残留（“预设”改为“默认/模式”，“设定”改为“设置”等），并补充私钥应急恢复包、加密导出与 Webhooks 回调说明。

            ### 🪟 3. 毛玻璃桌面微件原生零延迟改造 (Glass Widgets)
            - **默认中文直出**：升级 `widgets.html` 为 `lang="zh-CN"`，所有单选框、滑动条、微件类别与外观设置默认直接中文直出；
            - **微件元数据 Fallback 汉化**：同步更新 `widgets-settings.js` 中 `CATALOG` 所有微件的中文名称与长文本详细描述。

            ### 🚗 4. 整车控制与车机重启弹窗多语言对齐 (Vehicle Control)
            - **补齐整车上下电确认**：增加 `vehicle.power_on`、`vehicle.power_off` 及其安全二次确认弹窗、Toast 结果字典；
            - **车机系统重启确认**：将 `btnIviReboot` 弹窗与提示全面接入国际化，避免车端出现英文提示。
          files: release-assets/Overdrive-v49.9.20-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
