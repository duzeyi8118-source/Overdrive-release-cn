name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        # instead of the random per-runner debug keystore → consistent fingerprint every run.
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.18 -PoverdriveVersionCode=49918 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.18-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.18-cn-sec
          name: OverDrive v49.9.18 - 蓝牙靠近自动解闭锁、本地车控脱离云端与电池健康度展示
          body: |
            ## OverDrive v49.9.18 定制版 (三大核心特性合入)

            ### 📶 1. 蓝牙靠近自动解闭锁 (Proximity Access & 3D Radar)
            - **无感蓝牙靠近解闭锁**：基于车机原生蓝牙对已配对手机进行 RSSI 空间信号测距，实现人到自动解锁、离车自动落锁；
            - **双滞后区间滤波算法**：引入双时间滑动窗口与多重停留防抖（Dwell Time），彻底杜绝边缘信号波动导致的频繁反复误跳锁；
            - **全功能控制面板与 3D 雷达**：挂载“靠近感知”独立管理面板，支持实时 3D 距离雷达、平滑信号曲线、学习模式（Dry-Run）及自定义距离校准；
            - **全量地道简中本地化**：针对 `remote_access` 模块 88 个条目进行了高标准车机术语校准，杜绝机翻与英文遗漏。

            ### 🚗 2. 本地车控全面脱离云端 (Local Deterrents & Controls)
            - **毫秒级本地直控**：车门解锁、落锁、闪灯威慑与寻车指令升级为本地 SDK 优先（`SDK_FIRST`），彻底摆脱对比亚迪云端 API 的依赖；
            - **全系车型三级自适应**：
              - DiLink 5 原生平台：反射注入通过 `BYDAutoDoorLockDevice.setAllDoorsLock` 执行并进行双重读回确认；
              - DiLink 3/4 全系车型：通过 OEM 底层系统服务直发 26 字节钥匙报文，无网状态亦可秒级直发；
              - 备选通道：通过 `PermissiveContext` 绕过 Android 客户端权限检查直写特征码保底；
            - **离线与断网可用**：车机无流量、无网络或云端凭据失效时，所有车控按钮保持可用且操作响应立即生效。

            ### 🔋 3. 动力电池健康度展示 (Battery SOH & Degradation Trend)
            - **原生电池 SOH 读取**：采集底层 `STATISTIC_BATTERY_HEALTHY_INDEX` 特征值并在车辆状态、充电面板中实时展示；
            - **长期电池衰减趋势**：本地数据库完整记录历史 SOH 变化并绘制趋势曲线图，直观掌握动力电池健康状态。
          files: release-assets/Overdrive-v49.9.18-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
