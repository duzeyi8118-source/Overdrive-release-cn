name: Build BYD Overdrive APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)
          echo "Found sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode permanent release keystore
        # RELEASE_KEYSTORE_BASE64 holds the PKCS12 keystore generated once and stored
        # as a GitHub Secret. Decoding it here guarantees every CI run signs with the
        # EXACT same certificate, so `pm install -r` upgrades work without uninstalling.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore decoded: $(stat -c%s app/release.keystore) bytes"
          mkdir -p ~/.android
          cp app/release.keystore ~/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug: keeps debug flags (no R8 shrink) but now uses our fixed keystore
        run: ./gradlew assembleDebug -PoverdriveVersionName=49.9.22 -PoverdriveVersionCode=49922 -PoverdriveUpdateChannel=alpha --stacktrace --no-daemon

      - name: Verify APK signature fingerprint
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Verifying: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          CERTS_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS_OUTPUT"

          EXPECTED="adc52cfa28f7b9ea723f11dae874639eb1bddc6bacadb2daf18a90435dc8e293"
          if echo "$CERTS_OUTPUT" | grep -qi "$EXPECTED"; then
            echo "✅ Verified: APK signature matches permanent keystore ($EXPECTED)!"
          else
            echo "❌ Fingerprint mismatch! Expected $EXPECTED not found in apksigner output."
            exit 1
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-assets/Overdrive-v49.9.22-cn-sec.apk
          ls -lh release-assets/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overdrive-Signed-APK
          path: release-assets/*.apk
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v49.9.22-cn-sec
          name: OverDrive v49.9.22 - 深度排查清理全库机翻与服务侧/原生层地毯式精校
          body: |
            ## OverDrive v49.9.22 定制版 (全库地毯式复查精校)

            ### 🇨🇳 1. 彻底清除服务侧与自动化规则荒谬机翻 (Server i18n & Automations)
            - **动力总成与驾驶**：修正“驱动器和能量列车”为“驾驶与动力总成”、“驱动器模式”为“驾驶模式”；
            - **空调进气与座舱**：修正“空中重新计算”为“空气内循环”、“重新计算”为“内循环”、“新鲜空气：”为“外循环”、“空中摄入量”为“进气模式”、“引导轮加热器”为“方向盘加热”、“小屋光”为“座舱阅读灯”、“仅限粉丝模式”为“纯通风模式”；
            - **底盘与脚感**：修正“美福特”为“舒适”、“设置制动画功能”为“设置制动踏板脚感”；
            - **主动安全与雷达**：修正“盲人点警告”为“盲区预警”、“设置后交叉流量警告”为“设置后方横向来车预警 (RCTA)”、“设置后台交叉流量制表”为“设置后方横向来车制动 (RCTB)”、“设置前台交叉流制图”为“设置前方横向来车制动 (FCTB)”、“设置紧急通道保持中”为“设置紧急车道保持 (ELKA)”、“设置通道助手”为“设置车道辅助”、“设置门打开警告”为“设置开门预警 (DOW)”、“设置前向碰撞警告”为“设置前向碰撞预警 (FCW)”。

            ### 🔋 2. 深度精校 ABRP 遥测与通知系统 (ABRP & Notifications)
            - **ABRP 核心术语重写**：修正“责任的状态”为“电池剩余电量 (SOC)”、“输入”为“上传次数”、“删除的标志”为“访问令牌已删除”、“现场电测”为“实时遥测”、“停车场”为“已驻车”、“开车”为“行驶中”、“快速充电DC”为“直流快充中”、“永远不会”为“从未”；
            - **推送设置与设备管理**：修正“无名设备”为“未命名设备”、“最后见到的{time}”为“最近活跃于 {time}”、“永远不会”为“从未”，规范统一“仪表盘”。

            ### 📱 3. 蓝牙靠近感应解闭锁、防冲锁存与桌面微件动态汉化 (Proximity & Widgets)
            - **靠近感应 (Remote Access)**：手机/实体钥匙 50+ 项状态原因、实时诊断、滤波时钟、雷达标题、落锁/解锁确认及标定提示全量实现地道中文本地化；
            - **首屏直出与防抖**：修正 SafeKeep、Widgets、Telegram 页面中原本残留的英文兜底标签，实现 100% 零闪烁中文直出。

            ### 🔋 4. Android 原生层与 SOH 弹窗严谨校准 (Native Strings & SOH)
            - **电池容量范围校准**：修正 Android 原生弹窗中“容量必须为15-120kWh”错误为“容量必须在 5 - 120 kWh 之间”，兼容混动 PHEV 小电池包；
            - **实测帧与路况导航**：修正“电池包容量框架不匹配”为“电池包容量与实测帧不一致”、“关闭路由 - 重新计算…”为“偏离路线，正在重新规划…”。

            ### 🛡️ 5. 门禁与兼容性 100% 达标
            - 严格通过 `scripts/i18n_check.py` 门禁测试 (missing=0, stale=0, variant clean, 0 errors)。
          files: release-assets/Overdrive-v49.9.22-cn-sec.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
